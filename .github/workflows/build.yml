name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - run: go test -mod=vendor -timeout 120s ./...
        working-directory: engine
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build desktop/Wayline.csproj -c Release --configfile desktop/NuGet.Config

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile linux/wayline linux/wayline_gui.py linux/package.py scripts/package_release.py scripts/generate_icons.py
